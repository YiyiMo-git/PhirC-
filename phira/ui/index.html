<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Phigros - v 3.2</title>
<style>
@font-face {
  font-family: 'cmdysj';
  src: url('./assets/cmdysj.ttf') format('truetype');
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  overflow: hidden;
  background: #000;
  height: 100vh; width: 100vw;
  font-family: 'cmdysj', 'Microsoft YaHei', sans-serif;
  color: #fff;
}

canvas#main-canvas {
  display: block;
  width: 100vw; height: 100vh;
  background: #000;
  position: absolute;
  top: 0; left: 0;
  z-index: 1;
}

/* ==================== UI 层 ==================== */
#ui-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* ---- 左侧人物立绘（右侧羽化） ---- */
.left-character {
  position: absolute;
  left: -3%;
  bottom: 0;
  height: 100vh;
  pointer-events: auto;
  cursor: pointer;
  -webkit-mask-image: linear-gradient(to right, black 55%, transparent 100%);
  mask-image: linear-gradient(to right, black 55%, transparent 100%);
  transition: opacity 0.3s ease;
}
.left-character:hover {
  opacity: 0.95;
}
.left-character img {
  height: 100vh;
  width: auto;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* ---- 右上 Logo ---- */
.logo {
  position: absolute;
  top: 30px;
  right: 30px;
  width: 200px;
  pointer-events: none;
}
.logo img {
  width: 100%;
  display: block;
}

/* ---- 右侧面板 ---- */
.right-panel {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  width: 460px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  pointer-events: auto;
}

/* ---- 玻璃按钮基础 ---- */
.glass-btn {
  position: relative;
  display: flex;
  align-items: center;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  color: #fff;
  cursor: pointer;
  user-select: none;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

/* 玻璃高光 */
.glass-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.06) 100%);
  pointer-events: none;
}

.glass-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.32);
  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
}
.glass-btn:active {
  transform: translateY(0) scale(0.985);
}

/* ---- 主按钮（开始游玩） ---- */
.glass-btn.main {
  height: 100px;
  padding: 0 44px;
  background: rgba(120, 240, 255, 0.12);
  border: 1.5px solid rgba(150, 240, 255, 0.55);
  box-shadow: 
    0 0 40px rgba(0, 200, 255, 0.15) inset,
    0 4px 24px rgba(0, 150, 220, 0.2);
}
.glass-btn.main:hover {
  background: rgba(120, 240, 255, 0.2);
  border-color: rgba(150, 240, 255, 0.9);
  box-shadow: 
    0 0 50px rgba(0, 220, 255, 0.3) inset,
    0 8px 32px rgba(0, 180, 240, 0.3);
}

.main-cn {
  font-size: 2rem;
  font-weight: bold;
  letter-spacing: 4px;
  line-height: 1;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}
.main-en {
  font-size: 0.85rem;
  letter-spacing: 2px;
  color: rgba(180, 240, 255, 0.75);
  margin-left: 14px;
  align-self: flex-end;
  margin-bottom: 8px;
}
.main-arrow {
  margin-left: auto;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease;
}
.glass-btn.main:hover .main-arrow {
  transform: translateX(6px);
}
.main-arrow svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #a0f0ff;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(150, 240, 255, 0.6));
}

/* ---- 次级按钮 ---- */
.glass-btn.sec {
  height: 76px;
  padding: 0 44px;
  font-size: 1.5rem;
  font-weight: bold;
  letter-spacing: 4px;
}

/* ---- 并排按钮 ---- */
.btn-row {
  display: flex;
  gap: 16px;
}
.btn-row .glass-btn {
  flex: 1;
  height: 76px;
  justify-content: center;
  padding: 0 20px;
  letter-spacing: 3px;
  font-size: 1.35rem;
  font-weight: bold;
}

/* ---- 白色按钮 ---- */
.glass-btn.white {
  height: 76px;
  justify-content: center;
  background: rgba(255, 255, 255, 0.95);
  color: #0b1116;
  border: none;
  font-size: 1.4rem;
  font-weight: bold;
  letter-spacing: 4px;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.glass-btn.white::before {
  background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, transparent 50%, rgba(0,0,0,0.04) 100%);
}
.glass-btn.white:hover {
  background: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 8px 32px rgba(255, 255, 255, 0.35);
}

/* ---- 版本号 ---- */
.version {
  position: absolute;
  right: 32px;
  bottom: 22px;
  color: rgba(255, 255, 255, 0.65);
  font-size: 1.05rem;
  letter-spacing: 1px;
  pointer-events: none;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

/* ---- 隐藏文件输入 ---- */
#file-input {
  display: none;
}

/* ---- 双击提示 ---- */
.hint {
  position: absolute;
  left: 40px;
  bottom: 24px;
  color: rgba(255, 255, 255, 0.35);
  font-size: 0.85rem;
  letter-spacing: 2px;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
</style>
</head>
<body>
<canvas id="main-canvas"></canvas>

<div id="ui-layer">
  <!-- 左侧人物立绘（双击替换） -->
  <div class="left-character" id="char-area" title="双击更换曲绘">
    <img id="char-img" src="./assets/3.png" alt="Character">
  </div>

  <!-- 右上 Logo -->
  <div class="logo">
    <img src="./assets/phirc.png" alt="Phirc">
  </div>

  <!-- 右侧菜单 -->
  <div class="right-panel">
    <!-- 主按钮 -->
    <div class="glass-btn main" id="btn-start">
      <span class="main-cn">开始游玩</span>
      <span class="main-en">GAME</span>
      <span class="main-arrow">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </div>

    <!-- 资源包 -->
    <div class="glass-btn sec" id="btn-res">
      <span>资源包</span>
    </div>

    <!-- 设置 + 活动 -->
    <div class="btn-row">
      <div class="glass-btn" id="btn-settings">
        <span>设置</span>
      </div>
      <div class="glass-btn" id="btn-activity">
        <span>活动</span>
      </div>
    </div>

    <!-- 上次游玩的谱面 -->
    <div class="glass-btn white" id="btn-last">
      <span>上次游玩的谱面</span>
    </div>
  </div>

  <!-- 版本号 -->
  <div class="version">Version: v 3.2</div>

  <!-- 双击提示 -->
  <div class="hint" id="hint">双击左侧曲绘可更换图片</div>

  <!-- 隐藏文件输入 -->
  <input type="file" id="file-input" accept="image/*">
</div>

<script>
// ==================== WebGL 背景（照搬 trigrid 着色器） ====================
(function() {
  const canvas = document.getElementById('main-canvas');
  const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  if (!gl) { console.error('WebGL 不支持'); return; }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  const vs = `#version 300 es
in vec2 a_pos;
out vec2 uv;
void main() {
  uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

  const fs = `#version 300 es
precision highp float;
in vec2 uv;
out vec4 out_color;

uniform sampler2D screenTexture;
uniform vec2 tex_size;
uniform float t;

void main() {
  vec2 uv2 = uv;
  vec2 w = uv2 - 0.5;
  uv2.x += pow(abs(w.y), 2.0) * (-w.x);
  uv2.x += tex_size.x / 2.0;

  vec2 new_uv = mod(uv2 / tex_size, 1.0);
  vec4 texColor = texture(screenTexture, new_uv);

  float k = 0.8;
  float k2 = 1.6;
  float p = max(0.0, min(1.0, ((sin((uv2.y + t) * k2) - k) * (1.0 / (1.0 - k)))));
  p = 0.35 + 0.65 * p;

  vec3 base_color = vec3(0.018, 0.018, 0.018);
  vec3 face_color = vec3(0.702, 0.945, 1.0);
  vec3 grid_color = vec3(1.0);
  vec3 glow_color = vec3(0.383, 0.884, 1.0);

  vec3 col = base_color
    + grid_color * 0.4 * texColor.r * 1.0
    + face_color * 0.1 * texColor.b * p * 2.0
    + glow_color * pow(0.71 * texColor.g * p * 5.0, 1.0);

  out_color = vec4(col, 1.0);
}`;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const u_t = gl.getUniformLocation(prog, 't');
  const u_tex = gl.getUniformLocation(prog, 'screenTexture');
  const u_tex_size = gl.getUniformLocation(prog, 'tex_size');
  gl.uniform2f(u_tex_size, 0.22, 0.27);

  // 加载 TriGridBase.png
  const texture = gl.createTexture();
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(u_tex, 0);
    startRender();
  };
  img.onerror = () => {
    console.warn('TriGridBase.png 未找到，使用程序生成的网格');
    startRender();
  };
  img.src = './assets/TriGridBase.png';

  const startTime = performance.now();
  function startRender() {
    function frame() {
      const t = (performance.now() - startTime) / 1000;
      gl.uniform1f(u_t, t);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();

// ==================== 双击替换曲绘 ====================
const charImg = document.getElementById('char-img');
const fileInput = document.getElementById('file-input');
const hint = document.getElementById('hint');

// 双击 UI 层：如果落在左侧 40% 区域，则打开文件选择
document.addEventListener('dblclick', (e) => {
  const x = e.clientX;
  const w = window.innerWidth;
  if (x < w * 0.4) {
    fileInput.click();
  }
});

// 首次点击后隐藏提示
let hintHidden = false;
document.addEventListener('click', () => {
  if (!hintHidden && hint) {
    hint.style.opacity = '0';
    hintHidden = true;
  }
});

// 文件选择后替换图片
fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    charImg.src = ev.target.result;
    console.log('[UI] 曲绘已替换:', file.name);
  };
  reader.readAsDataURL(file);
  // 允许重复选择同一文件
  fileInput.value = '';
});

// ==================== 按钮点击（占位） ====================
document.getElementById('btn-start').addEventListener('click', () => {
  console.log('[UI] 开始游玩');
});
document.getElementById('btn-res').addEventListener('click', () => {
  console.log('[UI] 资源包');
});
document.getElementById('btn-settings').addEventListener('click', () => {
  console.log('[UI] 设置');
});
document.getElementById('btn-activity').addEventListener('click', () => {
  console.log('[UI] 活动');
});
document.getElementById('btn-last').addEventListener('click', () => {
  console.log('[UI] 上次游玩的谱面');
});
</script>
</body>
</html>
