[package]
name = "phira"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["video"]
video = ["prpr/video"]
chat = []
hykb = []
event_debug = []
# 嵌入 Phirc Mod++ 的 WebView 界面（登录 / 开始 / 曲库）。
# 仅 Windows + wry 真正实现；默认关闭，关闭时界面走原有 Rust UI。
webui = ["dep:wry", "dep:raw-window-handle"]

[dependencies]
anyhow = { workspace = true }
arc-swap = "1.9.0"
async-trait = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
bytes = "1.11.1"
bytesize = "2.3.1"
cacache = { version = "13.1.0", default-features = false, features = [
    "tokio-runtime",
] }
cfg-if = "1.0.4"
chrono = { workspace = true, features = ["serde"] }
dashmap = "6.1.0"
futures-util = { workspace = true }
hex = { workspace = true }
image = { workspace = true, default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "rayon",
    "webp",
] }
inputbox = { workspace = true }
logos = "0.16.1"
lru = { workspace = true }
lyon = { workspace = true }
macroquad = { workspace = true, default-features = false }
nalgebra = { workspace = true }
obfstr = "0.4.4"
once_cell = { workspace = true }
pollster = { workspace = true }
prpr = { workspace = true, features = ["log"], default-features = false }
prpr-l10n = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "charset",
    "http2",
    "system-proxy",
    "rustls",
    "query",
] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
smallvec = "1.15.1"
tap = "1.0.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = { workspace = true }
zip = { workspace = true, features = ["chrono"] }
zstd = "0.13"

miniquad = { workspace = true }
phira-mp-client = { workspace = true }
phira-mp-common = { workspace = true }
sanitize-filename = "0.6.0"
daachorse = "3.0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
sasa = { workspace = true, default-features = false, features = ["oboe"] }

[target.'cfg(target_env = "ohos")'.dependencies]
sasa = { workspace = true, default-features = false, features = ["ohos"] }
napi-derive-ohos = { version = "1.1.6" }
napi-ohos = { version = "1.1.6", default-features = false, features = [
    "napi8",
    "async",
] }

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
sasa = { workspace = true, default-features = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# 仅在使用 `webui` feature 时才编译（可选依赖）
# wry 0.44 提供 new_as_child + with_custom_protocol + with_ipc_handler，适合挂到已有窗口
wry = { version = "0.44", optional = true }
# wry 0.44 依赖 raw-window-handle 0.6：把 macroquad 窗口 HWND 包装成 HasWindowHandle
raw-window-handle = { version = "0.6", optional = true }
# 用于从 macroquad 窗口标题拿到 HWND，把 WebView 挂成子窗口
# HiDpi：用 GetDpiForWindow 把 GetClientRect 的物理像素换算成 wry 需要的逻辑像素
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-ui-kit = { workspace = true }

[build-dependencies]
dotenv-build = "0.1"
# 只在 iOS 目标下用来编 ios/motion.m（CoreMotion 包装）；版本跟 Cargo.lock 里已有的保持一致
cc = "1"

[dev-dependencies]
fluent = { workspace = true }
fluent-syntax = { workspace = true }
